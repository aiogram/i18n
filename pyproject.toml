[project]
name = "aiogram_i18n"
authors = [
    { name = "RootShinobi" },
]
description = "small translation tools for aiogram"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "telegram",
    "bot",
    "api",
    "framework",
    "wrapper",
    "asyncio",
    "i18n",
    "aiogram",
    "fluent",
    "gnutext",
]
dynamic = ["version"]
dependencies = [
    "aiogram>=3.0.0b8",
    "click~=8.1.0",
]

[tool.uv]
package = true

[tool.hatch.version]
path = "aiogram_i18n/__meta__.py"

[project.urls]
Repository = "https://github.com/aiogram/aiogram_i18n"

[project.scripts]
i18n = "aiogram_i18n.__main__:main"

[project.optional-dependencies]
compiler = [
    "fluent_compiler~=1.0",
]
runtime = [
    "fluent.runtime~=0.4.0",
]
jinja2 = [
    "jinja2~=3.1.4",
]
test = [
    "pytest~=7.4",
    "pytest-cov~=6.1",
    "pytest-asyncio~=0.23",
    "pytest-lazy-fixture~=0.6.3",
    "fluent_compiler~=1.0",
    "fluent.runtime~=0.4.0",
    "libcst~=1.7",
    "coverage~=7.8",
]
dev = [
    "isort==6.0.1",
    "pre-commit==4.2.0",
    "ruff==0.11.6",
    "mypy==1.15.0",
    "packaging~=24.0",
]
docs = [
    "sphinx~=7.4",
    "furo~=2024.8",
    "sphinx-autobuild~=2024.10",
]

[tool.hatch.envs.dev]
post-install = [
    "pre-commit install",
]

features = [
    "compiler",
    "runtime",
    "jinja2",
    "dev",
    "test",
    "docs",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = [
    "\\.?venv",
    "\\.idea",
    "\\.tests?",
]

[[tool.mypy.overrides]]
module = "mre"
strict_optional = false

[[tool.mypy.overrides]]
module = "aiogram_i18n.types"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = [
    "redis.*", "fluent_compiler.*"
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 99

[tool.ruff.lint]
select = [
    "C",
    "DTZ",
    "E",
    "F",
    "I",
    "ICN",
    "ISC",
    "N",
    "PLC",
    "PLE",
    "Q",
    "S",
    "T",
    "W",
    "YTT",
]
ignore = [
    "N805",
    "C901",
    "E203",
    "I001",
]
unfixable = []
exclude = [
    "examples"
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
py_version = 39
line_length = 99
multi_line_output = 3
force_grid_wrap = 0
include_trailing_comma = true
split_on_trailing_comma = false
single_line_exclusions = ["."]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_gitignore = true
extend_skip = ["__pycache__"]
