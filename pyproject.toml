[project]
name = "aiogram_i18n"
version = "1.5"
authors = [
    { name = "RootShinobi" },
]
description = "Translation tool for aiogram"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "telegram",
    "bot",
    "api",
    "framework",
    "wrapper",
    "asyncio",
    "i18n",
    "aiogram",
    "fluent",
    "gnutext",
]
dependencies = [
    "aiogram>=3.0.0b8",
    "click==8.*",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/aiogram/aiogram_i18n"

[project.scripts]
i18n = "aiogram_i18n.__main__:main"

[project.optional-dependencies]
compiler = [
    "fluent_compiler~=1.1",
]
runtime = [
    "fluent.runtime~=0.4.0",
]
jinja2 = [
    "jinja2~=3.1.4",
]
test = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-asyncio==1.2.0",
    "fluent.runtime==0.4.0",
    "coverage==7.13.4",
]
dev = [
    "isort==8.0.1",
    "pre-commit==4.5.1",
    "ruff==0.15.5",
    "mypy==1.19.1",
    "types-polib==1.2.0.20250401",
]
docs = [
    "sphinx==8.1.3",
    "furo==2025.12.19",
    "sphinx-autobuild==2024.10.3",
]

[tool.hatch.envs.dev]
post-install = [
    "pre-commit install",
]

features = [
    "compiler",
    "runtime",
    "jinja2",
    "dev",
    "test",
    "docs",
]

[tool.isort]
py_version = 310
line_length = 99
multi_line_output = 3
force_grid_wrap = 0
include_trailing_comma = true
split_on_trailing_comma = false
single_line_exclusions = ["."]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_gitignore = true
extend_skip = ["__pycache__"]

[tool.ruff]
src = ["src", "tests"]
line-length = 99
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "__pycache__",
    "venv",
    ".venv",
    "tests/.files",
    "tests/files/py",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "ANN001", "ANN003", "ANN204", "ANN401",
    "COM812",
    "CPY001",
    "D",
    "DOC",
    "FBT001", "FBT002",
    "N805",
    "PLC0415",
    "PLR0913", "PLR0917", "PLR1702", "PLR6301",
    "PLW2901",
    "RUF052", "RUF067",
    "TC006",
    "TID252",
]
unfixable = []
exclude = [
    "examples"
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
mypy_path = "src"
packages = ["aiogram_i18n"]
plugins = ["pydantic.mypy"]
allow_redefinition = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
extra_checks = true
follow_imports = "skip"
follow_imports_for_stubs = false
ignore_missing_imports = false
namespace_packages = true
no_implicit_optional = true
no_implicit_reexport = true
pretty = true
show_absolute_path = true
show_error_codes = true
show_error_context = true
warn_unused_configs = true
warn_unused_ignores = true
disable_error_code = [
    "no-redef",
]
exclude = [
    "\\.?venv",
    "\\.idea",
    "\\.tests?",
]

[[tool.mypy.overrides]]
module = "mre"
strict_optional = false

[[tool.mypy.overrides]]
module = "aiogram_i18n.types"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = [
    "redis.*", "fluent_compiler.*"
]
ignore_missing_imports = true
