name: "Deploy"

on:
  release:
    types: [ published ]

jobs:
  build_and_publish:
    name: 📦 Build and publish
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.9.22"
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ env.UV_PYTHON }}
        run: uv python install ${{ env.UV_PYTHON }}

      - name: Install the project
        run: uv sync

      - name: Build dist
        run: uv build

      - name: Verify wheel installation
        run: uv run --verbose --with aiogram_i18n --no-project --refresh-package aiogram_i18n -- python -c "import aiogram_i18n; print(aiogram_i18n.__version__)"

      - name: 🐍 Publish distribution 📦
        run: uv publish --username __token__ --token ${{ secrets.PYPI_TOKEN }}
